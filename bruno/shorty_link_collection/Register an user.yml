info:
  name: Register an user
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "name": "Miguel Lozano",
        "email": "miguel.test@example.com",
        "password": "TestPassword123!",
        "birthdate": "2003-05-15"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Register endpoint

  Require the following schema to register a new user:
  {
  "email": "example@email.com",
  "password: "passwordExample"
  }
